# ------------------------------------------------------------------
# Single source for all publications on the website.
# Used by: /publications/ page, "Recent publications" on the home page,
# and the link rows on the research project pages.
#
# Fields per entry (all optional except authors and title):
#   id          short key, used to reference the entry from project pages
#   authors     author list ending with a full stop; "Rowold, C." is printed in bold
#   year        publication year (or status such as "Online first")
#   title       title of the paper
#   venue       journal / book / outlet (printed in italics)
#   details     volume, issue, pages etc.
#   status      e.g. "Revise & Resubmit at Feminist Economics"
#   doi         DOI without https://doi.org/
#   paper       link to the published version (if not the DOI)
#   wp          link to working paper / preprint
#   code        link to replication code
#   bluesky     link to Bluesky summary thread
#   linkedin    link to LinkedIn summary post
#   video       link to a video / recorded presentation
#   blog        link to a (German) blog post about the paper
#   pdf         self-hosted PDF
#   summary_de  German summary (PDF)
#   german      German-language version of the publication
#   project     URL of the research project page (+ anchor)
# ------------------------------------------------------------------

